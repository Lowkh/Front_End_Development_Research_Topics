<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a page easier to use</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #eef3f8; }
    .activity-card { max-width: 28rem; border: 1px solid #888; padding: 1rem; } section { margin-bottom: 2rem; }
  </style>
</head>
<body>
  <p><a href="index.html">Back to example index</a></p>
  <h1>Make a page easier to use</h1>
  <section>
  <h2>Before</h2>
  <div>Robotics</div><div>Friday 3 pm</div>
  <button type="button">Click here</button>
</section>
<section>
  <h2>Proposed improvement</h2>
  <article class="activity-card">
    <h3>Robotics Workshop</h3>
    <p>Friday, 3:00 pm · Engineering Lab</p>
    <p>Suitable for beginners. Equipment provided.</p>
    <button type="button">Join Robotics Workshop</button>
  </article>
</section>
  <script>

  </script>
</body>
</html>
