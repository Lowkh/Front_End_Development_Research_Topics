<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolve CSS conflicts</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #eef3f8; }
    .same { color: red; }
.same { color: blue; }
.stronger { color: red; }
p { color: blue; }
#specific { color: green; }
.third { color: blue; }
  </style>
</head>
<body>
  <p><a href="index.html">Back to example index</a></p>
  <h1>Resolve CSS conflicts</h1>
  <p class="same">Case A: same specificity</p>
<p class="stronger">Case B: class versus type</p>
<p id="specific" class="third">Case C: ID versus class</p>
  <script>

  </script>
</body>
</html>
